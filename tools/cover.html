<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;600&display=swap">
<style>
html,body{margin:0;width:640px;height:360px;overflow:hidden}
body{display:flex;background:#faf8f6;font-family:Manrope,sans-serif;color:#3d2f2c}
.l{width:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  background:radial-gradient(120% 100% at 30% 0%,#fdf2f0 0%,#f8ebe9 55%,#f5deda 100%)}
.logo{width:196px;height:56px;background:#60413d;-webkit-mask:url(../brand/logo.svg) center/contain no-repeat;mask:url(../brand/logo.svg) center/contain no-repeat}
h1{margin:18px 0 0;font:600 40px/1 "Cormorant Garamond",serif;color:#60413d;letter-spacing:.01em}
.t{margin:6px 0 0;font:italic 500 18px "Cormorant Garamond",serif;color:#8a7672}
.f{margin:22px 0 0;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#60413d;line-height:1.9}
.r{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:14px 14px 14px 8px}
.r div{border-radius:8px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
.r img{height:292px;width:auto;max-width:96%;object-fit:contain;display:block}
</style></head><body>
<div class="l"><div class="logo"></div><h1>Каталог</h1><p class="t">женский трикотаж · оптом</p>

<div class="r"><div><img src="cov/m-105h.png"></div><div><img src="cov/mtk-116k.png"></div><div><img src="cov/k-302.png"></div></div>
</body></html>
